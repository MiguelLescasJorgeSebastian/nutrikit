# Configuración completa de Jenkins (Configuration as Code). Se aplica al arrancar el contenedor.
# Lo que cambies desde la interfaz se pierde al reiniciar: cámbialo aquí.
# Los ${VARIABLES} vienen de infra/jenkins/.env (ver .env.example).

jenkins:
  systemMessage: >-
    nutrikit CI. Configuración versionada en infra/jenkins/casc/jenkins.yaml;
    los cambios hechos aquí se pierden al reiniciar.
  # Los builds corren en el controlador. En una laptop basta; en un servidor se usan agentes
  # separados y el controlador queda en 0 ejecutores (ver README.md).
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8081/}"

tool:
  jdk:
    installations:
      # Copiado del contenedor eclipse-temurin:25-jdk en el Dockerfile.
      - name: temurin-25
        home: /opt/jdk-25

credentials:
  system:
    domainCredentials:
      - credentials:
          # Token de GitHub de solo lectura. Sin él, Jenkins consulta la API de GitHub de forma
          # anónima (60 peticiones por hora) y los escaneos de ramas se frenan.
          - usernamePassword:
              scope: GLOBAL
              id: github-token
              description: Token de GitHub (solo lectura del repositorio)
              username: "${GITHUB_USER:-}"
              password: "${GITHUB_TOKEN:-}"

jobs:
  # Multibranch Pipeline: un job por rama y por Pull Request que tenga Jenkinsfile.
  - script: |
      def token = System.getenv('GITHUB_TOKEN')
      multibranchPipelineJob('nutrikit') {
        displayName('nutrikit')
        description('Ramas y Pull Requests del repositorio. Cada uno corre el Jenkinsfile de la raíz.')
        branchSources {
          branchSource {
            source {
              github {
                id('nutrikit-github')
                repoOwner(System.getenv('NUTRIKIT_REPO_OWNER') ?: 'MiguelLescasJorgeSebastian')
                repository(System.getenv('NUTRIKIT_REPO_NAME') ?: 'nutrikit')
                repositoryUrl('https://github.com/' + (System.getenv('NUTRIKIT_REPO_OWNER') ?: 'MiguelLescasJorgeSebastian') + '/' + (System.getenv('NUTRIKIT_REPO_NAME') ?: 'nutrikit'))
                configuredByUrl(true)
                if (token) {
                  credentialsId('github-token')
                }
                traits {
                  // Ramas, sin duplicar las que ya tienen un PR abierto.
                  gitHubBranchDiscovery { strategyId(1) }
                  // PRs del mismo repositorio, construidos como si ya estuvieran integrados en main.
                  gitHubPullRequestDiscovery { strategyId(1) }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        // Jenkins corre en tu laptop y GitHub no le puede avisar de cada push (webhook): revisa
        // el repositorio cada 5 minutos.
        triggers {
          periodicFolderTrigger { interval('5m') }
        }
        // Las ramas borradas en GitHub se eliminan de Jenkins.
        orphanedItemStrategy {
          discardOldItems { numToKeep(0) }
        }
      }
