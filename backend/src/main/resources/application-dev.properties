# Perfil de desarrollo: lo activa ./mvnw spring-boot:run (ver pom.xml).
# Credenciales solo del Postgres local de compose.yaml; nunca se usan fuera de tu máquina.

# La app se conecta como nutrikit_app (sujeta a RLS); Flyway migra como el dueño.
spring.datasource.url=jdbc:postgresql://localhost:5433/nutrikit
spring.datasource.username=nutrikit_app
spring.datasource.password=nutrikit_app
spring.flyway.user=nutrikit
spring.flyway.password=nutrikit

# Identificar el consultorio sin configurar DNS:
#   curl -H 'X-Tenant: nutri-ana' localhost:8080/api/consultorio
#   curl nutri-ana.localhost:8080/api/consultorio
nutrikit.tenancy.cabecera-habilitada=true
nutrikit.tenancy.dominio-base=localhost
