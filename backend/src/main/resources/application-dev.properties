# Perfil de desarrollo: lo activa ./mvnw spring-boot:run (ver pom.xml).
# Credenciales solo del Postgres local de compose.yaml; nunca se usan fuera de tu máquina.

# La app se conecta como nutrikit_app (sujeta a RLS); Flyway migra como el dueño.
spring.datasource.url=jdbc:postgresql://localhost:5433/nutrikit
spring.datasource.username=nutrikit_app
spring.datasource.password=nutrikit_app
spring.flyway.user=nutrikit
spring.flyway.password=nutrikit

# Identificar el consultorio sin configurar DNS:
#   curl -H 'X-Tenant: nutri-ana' localhost:8080/api/consultorio
#   curl nutri-ana.localhost:8080/api/consultorio
nutrikit.tenancy.cabecera-habilitada=true
nutrikit.tenancy.dominio-base=localhost

# Swagger UI en http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Sin NUTRIKIT_JWT_SECRET se genera una clave al arrancar; los tokens dejan de servir al reiniciar.
nutrikit.seguridad.jwt.permitir-clave-efimera=true

# Operador local: operador@nutrikit.local / operador-dev
nutrikit.seguridad.operador.email=operador@nutrikit.local
nutrikit.seguridad.operador.password-hash={bcrypt}$2a$10$qdeesc9rka5wcWdzdenUJ.GVQV0P3l0bwOfMhpa2wJtJp7ClWEOu2

# Llave maestra de cifrado local: se crea la primera vez en tu cuenta, fuera del repositorio, y se
# conserva entre reinicios. Si la borras, los datos cifrados de tu base local quedan ilegibles.
nutrikit.cifrado.archivo-llave-local=${user.home}/.nutrikit/llave-maestra-dev
