spring.application.name=nutrikit

# --- Base de datos -------------------------------------------------------
# En desarrollo, Spring Boot levanta Postgres con compose.yaml y configura
# la conexión solo. En producción se usan variables de entorno (SPRING_DATASOURCE_*).
# El esquema lo controla Flyway; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Spring Modulith ------------------------------------------------------
# Registro de eventos entre módulos (outbox). Modulith crea su propia tabla.
spring.modulith.events.jdbc.schema-initialization.enabled=true

# --- Actuator ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,modulith
