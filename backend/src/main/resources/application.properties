spring.application.name=nutrikit

# --- Base de datos -------------------------------------------------------
# Dos usuarios (ver docs/adr/0004-implementacion-aislamiento-tenant.md):
#   - spring.datasource.*: la app, sin permisos de DDL y sujeta a Row-Level Security.
#   - spring.flyway.user/password: el dueño del esquema, solo para migrar.
# En producción vienen de variables de entorno (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_FLYWAY_USER, SPRING_FLYWAY_PASSWORD).
# En desarrollo, de application-dev.properties.
spring.flyway.placeholders.app_user=${spring.datasource.username}
# El esquema lo controla Flyway; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Multi-tenant -----------------------------------------------------------
# Las peticiones a /api/** (salvo /api/operador/**) identifican el consultorio por subdominio:
# {slug}.<dominio-base>. La cabecera X-Tenant solo se acepta si se habilita (desarrollo).
nutrikit.tenancy.dominio-base=nutrikit.mx
nutrikit.tenancy.cabecera-habilitada=false

# --- Spring Modulith ------------------------------------------------------
# Registro de eventos entre módulos (outbox). La tabla la crea Flyway (V2).
spring.modulith.events.jdbc.schema-initialization.enabled=false

# --- API -----------------------------------------------------------------
# Errores en formato Problem Details (RFC 9457): ver shared.web.ManejadorErroresApi.
# Evita páginas gigantes: ?size=5000 se recorta a 100.
spring.data.web.pageable.max-page-size=100

# --- OpenAPI ---------------------------------------------------------------
# Swagger UI en /swagger-ui.html y el contrato en /v3/api-docs.
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json

# --- Actuator ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,modulith
